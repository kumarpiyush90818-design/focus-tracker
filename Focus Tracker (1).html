<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Focus Tracker</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
:root{color-scheme:light dark;--bg:#f1f2f6;--card:#fff;--tx:#0f172a;--mut:#64748b;--ac:#ff5a0a;--ac2:#ff7a1a;--ok:#16a34a;--bd:#e5e7ef;--bad:#dc2626;--mid:#f59e0b;--onc:#fff;--sh:0 2px 10px rgba(15,23,42,.06);--grad:linear-gradient(135deg,#ff5a0a,#ff7a1a);box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0e1118;--card:#171b25;--tx:#f1f3f7;--mut:#94a0b4;--bd:#262c3a;--ok:#4ade80;--bad:#f87171;--sh:none}}
:root[data-theme="dark"]{--bg:#0e1118;--card:#171b25;--tx:#f1f3f7;--mut:#94a0b4;--bd:#262c3a;--ok:#4ade80;--bad:#f87171;--sh:none}
*{box-sizing:border-box}
body{margin:0 auto;background:var(--bg);color:var(--tx);font-family:"DM Sans",Inter,system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;max-width:560px;padding:0 0 32px;-webkit-font-smoothing:antialiased;line-height:1.4}
.hero{background:linear-gradient(135deg,#0d0d0d 0%,#3a1a0c 55%,#8a3a12 100%);color:#fff;padding:22px 20px 52px;border-radius:0 0 28px 28px}
.pill{display:inline-flex;align-items:center;gap:8px;border:1px solid rgba(255,255,255,.25);background:rgba(255,255,255,.08);border-radius:999px;padding:8px 14px;font-size:11px;font-weight:700;letter-spacing:.12em}
.pill i{width:10px;height:10px;border-radius:50%;background:var(--grad)}
h1{font-size:34px;font-weight:800;letter-spacing:-.02em;margin:16px 0 4px}
.hero .sub{color:rgba(255,255,255,.75);font-size:15px;margin:0}
.sub{color:var(--mut);font-size:13px;margin-bottom:16px}
h2{font-size:15px;font-weight:700;margin:0 0 6px}
.tabs{display:flex;gap:4px;margin:-28px 16px 14px;padding:8px;background:var(--card);border-radius:22px;box-shadow:0 10px 28px rgba(0,0,0,.18);position:relative}
.tabs button{flex:1;padding:12px 2px;border:0;background:transparent;color:var(--mut);border-radius:999px;font:700 14px inherit;font-family:inherit}
.tabs button{font-size:12.5px!important}
.tabs button.on{background:var(--grad);color:#fff;box-shadow:0 6px 14px rgba(255,90,10,.35)}
section{margin:0 16px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:20px;padding:16px;margin-bottom:12px;box-shadow:var(--sh)}
.bar{height:8px;background:var(--bd);border-radius:8px;overflow:hidden;margin:12px 0 2px}
.bar i{display:block;height:100%;background:var(--grad);width:0;border-radius:8px;transition:width .3s}
label.it{display:flex;gap:12px;align-items:flex-start;padding:12px 2px;border-bottom:1px solid var(--bd);font-size:15px;font-weight:500}
label.it:last-child{border-bottom:0}
input[type=checkbox]{appearance:none;-webkit-appearance:none;flex:none;width:22px;height:22px;margin:0;border:2px solid var(--mut);border-radius:7px;background:transparent;position:relative}
input[type=checkbox]:checked{background:var(--grad);border-color:var(--ac)}
input[type=checkbox]:checked::after{content:"";position:absolute;left:6px;top:2px;width:5px;height:10px;border:solid #fff;border-width:0 2.5px 2.5px 0;transform:rotate(45deg)}
label.it .t{color:var(--mut);font-size:12px;font-weight:500;display:block;margin-top:2px}
label.it.done span.x{text-decoration:line-through;color:var(--mut)}
.row{display:flex;gap:8px;margin-bottom:10px}
.row input{flex:1;min-width:0;padding:14px;border:1.5px solid var(--bd);border-radius:14px;background:var(--card);color:var(--tx);font:500 15px inherit;font-family:inherit}
.row button{padding:14px 20px;border:0;border-radius:14px;background:var(--grad);color:#fff;font:700 15px inherit;font-family:inherit;box-shadow:0 6px 14px rgba(255,90,10,.3)}
.del{border:0;background:transparent;color:var(--mut);padding:0 4px;margin-left:auto;font-size:14px}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px}
.chip{padding:10px 16px;border:1.5px solid var(--bd);background:var(--card);color:var(--tx);border-radius:999px;font:700 13px inherit;font-family:inherit}
.chip.on{background:var(--grad);color:#fff;border-color:transparent;box-shadow:0 6px 14px rgba(255,90,10,.3)}
.warn{border:1.5px solid var(--bad)}
.warn button{display:block;width:100%;text-align:left;border:0;background:transparent;color:var(--tx);padding:7px 0;font:500 14px inherit;font-family:inherit}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;text-align:center}
.cal .h{font-size:11px;font-weight:700;color:var(--mut);letter-spacing:.06em;padding-bottom:2px}
.cal button{aspect-ratio:1;border:1.5px solid var(--bd);background:transparent;color:var(--tx);border-radius:12px;font:600 13px inherit;font-family:inherit;padding:0}
.cal .ok{background:var(--ok);color:#fff;border-color:var(--ok)}
.cal .part{background:var(--mid);color:#fff;border-color:var(--mid)}
.cal .miss{background:var(--bad);color:#fff;border-color:var(--bad)}
.cal .tdy{outline:2px solid var(--ac);outline-offset:2px}
.cal .sel{box-shadow:0 0 0 2px var(--tx)}
.nav{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
.nav button{padding:8px 16px;border:1.5px solid var(--bd);background:var(--card);color:var(--tx);border-radius:12px;font-size:16px}
.leg{font-size:12px;color:var(--mut);margin-top:12px}
.lg{display:inline-block;width:10px;height:10px;border-radius:3px;margin:0 4px 0 10px;vertical-align:-1px}
.lg:first-child{margin-left:0}
.lg.ok{background:var(--ok)}.lg.part{background:var(--mid)}.lg.miss{background:var(--bad)}
.ch{border:1.5px solid var(--bd);border-radius:16px;padding:12px 14px;margin-bottom:12px}
.ch.full{border-color:var(--ok)}
.ch.full .chh b::after{content:"COMPLETE";background:var(--ok);color:#fff;font-size:10px;padding:3px 8px;border-radius:999px;margin-left:8px;letter-spacing:.08em;vertical-align:2px}
.chh{display:flex;align-items:center;font-size:15px}
.qr{display:flex;justify-content:space-between;align-items:center;font-size:14px;margin-top:8px}
.qb{padding:7px 11px;border:1.5px solid var(--bd);background:var(--card);color:var(--tx);border-radius:10px;margin-left:4px;font:700 13px inherit;font-family:inherit}
.row select{flex:1;min-width:0;padding:14px;border:1.5px solid var(--bd);border-radius:14px;background:var(--card);color:var(--tx);font:500 15px inherit;font-family:inherit}
.tip{display:none}
[hidden]{display:none!important}
</style>
</head>
<body>
<div class="hero"><span class="pill" id="pl"><i></i>100 DAY PLAN</span><h1>Focus Tracker</h1><div class="sub" id="date"></div></div>
<div class="tabs">
<button data-t="aaj" class="on">Aaj</button>
<button data-t="syl">Syllabus</button>
<button data-t="cy">Diary</button>
<button data-t="cal">Progress</button>
<button data-t="bd">Body</button>
</div>
<section id="aaj"></section>
<section id="syl" hidden></section>
<section id="cy" hidden></section>
<section id="cal" hidden></section>
<section id="bd" hidden></section>
<div class="tip">Ek-ek task karo. Bas aaj ka kaam khatam.</div>
<script>
var ROUTINE=[
["Subah uthna (6 baje)","6:00"],
["Fresh hona, tayaar hona","6:00 - 7:00"],
["Library: Physics / Maths (mushkil subject pehle)","7:00 - 9:30"],
["Library: Chemistry ya doosra subject","9:45 - 11:30"],
["Ghar wapas, lunch, thoda rest","12:00 - 1:00"],
["Duty","1:00 - 5:00"],
["Free time / exercise / bahar","5:00 - 9:00"],
["Ghar aana, khana","9:00"],
["Padhai: aaj ka chapter revise + questions","9:30 - 10:30"],
["Revision + doubts likhna","10:30 - 11:00"],
["Kal ka plan likho, sona","11:00"]
];
var DEF={
"Physics":["Electric Charges and Fields","Electrostatic Potential and Capacitance","Current Electricity","Moving Charges and Magnetism","Magnetism and Matter","Electromagnetic Induction","Alternating Current","Electromagnetic Waves","Ray Optics","Wave Optics","Dual Nature of Radiation and Matter","Atoms","Nuclei","Semiconductor Electronics"],
"Chemistry":["Solutions","Electrochemistry","Chemical Kinetics","d- and f-Block Elements","Coordination Compounds","Haloalkanes and Haloarenes","Alcohols, Phenols and Ethers","Aldehydes, Ketones, Carboxylic Acids","Amines","Biomolecules"],
"Maths":["Relations and Functions","Inverse Trigonometric Functions","Matrices","Determinants","Continuity and Differentiability","Applications of Derivatives","Integrals","Applications of Integrals","Differential Equations","Vector Algebra","Three Dimensional Geometry","Linear Programming","Probability"]
};
var BEDIT=false,MEDIT=false;
var TT=[['Uthna, paani, fresh hona','6:00-6:10'],['Warm-up + mobility','6:10-6:25'],['Home workout','6:25-7:00'],['Breakfast','7:00-7:30'],['Snack (banana / 30g moongfali)','10:00'],['Lunch','12:00'],['Duty (paani + khana yaad rakho)','1:00-4:00'],['Shaam ka snack','4:30'],['Study / library (study tracker alag)','5:00-9:30'],['Dinner','9:30-10:00'],['Kal ka plan + sleep (7-9 ghante)','10:00-10:30']];
var MEALS=[['Soya chunks 50g (dry)',170,26,'Breakfast 7:00'],['Besan 20g',80,4,'Breakfast 7:00'],['Atta 100g (roti/chilla)',340,12,'Breakfast 7:00'],['Banana (moongfali 30g ho to 170 kcal, 8g)',105,1,'Snack 10:00'],['Roti x2',200,7,'Lunch 12:00'],['Dal 1 katori',150,8,'Lunch 12:00'],['Sabzi 1 katori',80,2,'Lunch 12:00'],['Chawal 1 katori (pakka)',200,4,'Lunch 12:00'],['Banana / bhuna chana 30g',110,5,'Shaam snack 4:30'],['Roti x3',300,10,'Dinner 9:30'],['Dal 1 katori',150,8,'Dinner 9:30'],['Sabzi 1 katori',80,2,'Dinner 9:30']];
var EXD={push:['Push-up','Incline/knee 3x6-8','Standard 3x8-12','Standard/decline 4x10-15'],squat:['Squats','Bodyweight 3x12','Slow (3 sec neeche) 3x15','Backpack squat 4x12-15'],lunge:['Lunges','Reverse lunge 2x8 /leg','Reverse lunge 3x10 /leg','Backpack lunge 3x12 /leg'],row:['Backpack rows','Halka bag 3x10','Bag 3x12','Bhaari bag 4x12'],bridge:['Glute bridge','3x12','3x15 (2 sec hold)','4x15'],plank:['Plank','3x20 sec','3x30 sec','3x40 sec']};
var WA=['push','squat','row','bridge','plank'],WB=['push','lunge','row','bridge','plank'];
var DN=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'],TYN={A:'Full body A',B:'Full body B',M:'Halki walk + mobility',R:'Rest day'};
function WL(t){return t==='A'?WA:t==='B'?WB:[]}
function bbInit(){var b=S.bb=S.bb||{};b.times=b.times||TT.map(function(x){return x[1]});b.meals=b.meals||MEALS.map(function(x){return{n:x[0],k:x[1],p:x[2],g:x[3]}});b.tk=b.tk||2000;b.tp=b.tp||90;b.tw=b.tw||8;b.lv=b.lv||0;b.wd=b.wd||['R','A','R','B','R','A','M'];b.chk=b.chk||{};b.wl=b.wl||[];b.sum=b.sum||{};b.carry=b.carry||[]}
function bdCalc(k){var b=S.bb,c=b.chk[k]||{},ty=b.wd[parse(k).getDay()],ex=WL(ty),r={nt:TT.length,nx:ex.length,nm:b.meals.length,wt:b.tw,dt:0,dx:0,dm:0,kcal:0,pro:0,w:c.w||0,ty:ty};
TT.forEach(function(x,i){if(c['t'+i])r.dt++});ex.forEach(function(x,i){if(c['x'+i])r.dx++});b.meals.forEach(function(m,i){if(c['m'+i]){r.dm++;r.kcal+=+m.k||0;r.pro+=+m.p||0}});
var tot=r.nt+r.nx+r.nm+r.wt,dn=r.dt+r.dx+r.dm+Math.min(r.w,r.wt);r.pct=tot?Math.round(dn*100/tot):0;return r}
function bdTick(id,on,l){return '<label class="it'+(on?' done':'')+'"><input type="checkbox" id="'+id+'"'+(on?' checked':'')+'><span class="x">'+l+'</span></label>'}
function wChart(){var w=S.bb.wl.slice(-16);if(w.length<2)return '<div class="sub" style="margin:8px 0">Chart ke liye kam se kam 2 weight entry chahiye.</div>';var v=w.map(function(x){return x.w}),mn=Math.min.apply(0,v)-1,mx=Math.max.apply(0,v)+1,pt=w.map(function(x,i){return [10+i*280/(w.length-1),100-(x.w-mn)*90/(mx-mn)]});
return '<svg viewBox="0 0 300 110" style="width:100%;margin-top:8px"><polyline points="'+pt.map(function(q){return q[0].toFixed(1)+','+q[1].toFixed(1)}).join(' ')+'" fill="none" stroke="var(--ac)" stroke-width="2.5"/>'+pt.map(function(q){return '<circle cx="'+q[0].toFixed(1)+'" cy="'+q[1].toFixed(1)+'" r="3.5" fill="var(--ac)"/>'}).join('')+'</svg><div class="sub" style="margin:4px 0 8px">'+v[0]+' kg \u2192 '+v[v.length-1]+' kg ('+(v[v.length-1]-v[0]>=0?'+':'')+(v[v.length-1]-v[0]).toFixed(1)+' kg)</div>'}
function bdWeek(){var b=S.bb,d=parse(T),n=0,sp=0,sk=0,sr=0,sw=0,wk=0;for(var i=0;i<7;i++){var s=b.sum[key(d)];if(s){n++;sp+=s.p;sk+=s.k;sr+=s.pr;sw+=s.w;if(s.nx&&s.x===s.nx)wk++}d.setDate(d.getDate()-1)}
if(!n)return '';var tips=[];if(sr/n<b.tp*0.8)tips.push('Protein wale items (soya, dal, chana) roz tick karne par dhyan do.');if(sk/n<b.tk*0.8)tips.push('Khana kam tick hua, poore meals time par lo.');if(sw/n<b.tw*0.8)tips.push('Paani zyada piyo.');if(wk<2)tips.push('Kam se kam 2-3 workout poore karo.');if(!tips.length)tips.push('Isi routine par tike raho, level tabhi badhao jab sets aaraam se hon.');
return '<div class="card"><h2>Weekly summary</h2><div style="font-size:14px;line-height:1.7">Record hue din: <b>'+n+'/7</b><br>Average completion: <b>'+Math.round(sp/n)+'%</b><br>Poore workout: <b>'+wk+'</b><br>Tick kiya khana (avg): <b>'+Math.round(sk/n)+' kcal, '+Math.round(sr/n)+'g protein</b><br>Paani (avg): <b>'+(sw/n).toFixed(1)+' glass</b></div><div class="sub" style="margin:8px 0 0">Agle hafte ka focus: '+tips.slice(0,3).join(' ')+'</div></div>'}
function bdHist(){var b=S.bb,d=parse(T),h='',n=0;for(var i=1;i<=14;i++){d.setDate(d.getDate()-1);var k=key(d),s=b.sum[k];if(!s)continue;var c=b.chk[k]||{},eat=[];b.meals.forEach(function(m,j){if(c['m'+j])eat.push(m.n.split(' (')[0])});n++;h+='<div style="padding:9px 0;border-top:1px solid var(--bd);font-size:13px"><b>'+fmt(k)+'</b><div class="sub" style="margin:2px 0">Completion '+s.p+'% \u00b7 '+s.k+' kcal \u00b7 '+s.pr+'g protein \u00b7 Paani '+s.w+' glass \u00b7 Workout '+(s.nx?s.x+'/'+s.nx:'rest')+'</div>'+(eat.length?'<div>Khaya: '+esc(eat.join(', '))+'</div>':'<div class="sub" style="margin:0">Khana tick nahi hua</div>')+'</div>'}
return '<div class="card"><h2>Pichle din ka record</h2>'+(n?h:'<div class="sub" style="margin:0">Abhi sirf aaj ka record hai. Kal se yahan pichle din dikhenge.</div>')+'</div>'}
function renderBd(){var b=S.bb,c=b.chk[T]=b.chk[T]||{},r=bdCalc(T),lv=b.lv,ty=r.ty;
b.sum[T]={p:r.pct,k:Math.round(r.kcal),pr:Math.round(r.pro),w:r.w,x:r.dx,nx:r.nx};
var h='<div class="card"><h2>Aaj ka completion: '+r.pct+'%</h2><div class="bar"><i style="width:'+r.pct+'%"></i></div><div class="sub" style="margin:8px 0 0">Timetable '+r.dt+'/'+r.nt+' \u00b7 Workout '+r.dx+'/'+r.nx+' \u00b7 Khana '+r.dm+'/'+r.nm+' \u00b7 Paani '+r.w+'/'+r.wt+'</div><div class="sub" style="margin:6px 0 0">Ye sirf tumhare tick ka hisaab hai. Muscle roz ke khane, workout, neend aur waqt se banta hai, tick se nahi.</div></div>';
h+='<div class="card"><h2>Miss hua? Recovery</h2>';
b.carry.forEach(function(x,i){h+='<div style="display:flex;align-items:center"><div style="flex:1">'+bdTick('bb_c_'+i,x.d,esc(x.t))+'</div><button class="del" data-b="cx:'+i+'">\u2715</button></div>'});
h+='<div class="sub" style="margin:8px 0">Miss hua to double mat karo, kal bas 1-2 chhote kaam pure karo.</div><div class="row" style="margin:0"><button data-b="rec" style="flex:1">Aaj ke baaki kaam list mein daalo</button></div></div>';
h+='<div class="card"><div style="display:flex;justify-content:space-between;align-items:center"><h2>Daily timetable</h2><button class="chip" data-b="ed:t">'+(BEDIT?'Done':'Time edit')+'</button></div>';
TT.forEach(function(x,i){h+=BEDIT?'<div class="row" style="margin:6px 0"><span class="sub" style="flex:1;margin:0;align-self:center">'+esc(x[0])+'</span><input id="bb_ti_'+i+'" value="'+esc(b.times[i])+'" style="max-width:110px;flex:none"></div>':bdTick('bb_t_'+i,c['t'+i],esc(x[0])+'<span class="t">'+esc(b.times[i])+'</span>')});
h+='</div><div class="card"><h2>Aaj ka workout: '+TYN[ty]+'</h2>';
if(r.nx){h+='<div class="chips" style="margin-top:6px">'+['Level 1','Level 2','Level 3'].map(function(n,i){return '<button class="chip'+(lv===i?' on':'')+'" data-b="lv:'+i+'">'+n+'</button>'}).join('')+'</div>';WL(ty).forEach(function(k,i){var e=EXD[k];h+=bdTick('bb_x_'+i,c['x'+i],'<b>'+e[0]+'</b><span class="t">'+e[lv+1]+'</span>')});h+='<div class="sub" style="margin:8px 0 0">Sets ke beech 60-90 sec rest. Form saaf rakho; joint, kamar ya seene mein dard ya chakkar ho to ruk jao. Jab 2 hafte saare sets aaraam se hon, tab agla level.</div>'}
else h+='<div class="sub" style="margin:0">'+(ty==='M'?'Halki walk 15-20 min + stretching. Ye recovery hai, hard workout nahi.':'Aaj rest hai. Paani, khana aur neend par dhyan do, rest mein hi body recover hoti hai.')+'</div>';
h+='<h2 style="margin-top:14px">Weekly schedule</h2>';DN.forEach(function(n,i){h+='<div class="row" style="margin:6px 0"><span style="width:44px;align-self:center;font-size:14px">'+n+'</span><select id="bb_wd_'+i+'">'+['A','B','M','R'].map(function(k){return '<option value="'+k+'"'+(b.wd[i]===k?' selected':'')+'>'+TYN[k]+'</option>'}).join('')+'</select></div>'});
h+='<div class="sub" style="margin:6px 0 0">Beginner ke liye hafte mein 3 workout kaafi hain. Roz hard karne se thakan badhti hai.</div></div>';
h+='<div class="card"><div style="display:flex;justify-content:space-between;align-items:center"><h2>Khana (andaaze)</h2><button class="chip" data-b="ed:m">'+(MEDIT?'Done':'Portion edit')+'</button></div><div class="sub" style="margin:0">Calories: '+Math.round(r.kcal)+' / '+b.tk+'</div><div class="bar"><i style="width:'+Math.min(100,Math.round(r.kcal*100/b.tk))+'%"></i></div><div class="sub" style="margin:8px 0 0">Protein: '+Math.round(r.pro)+'g / '+b.tp+'g</div><div class="bar"><i style="width:'+Math.min(100,Math.round(r.pro*100/b.tp))+'%"></i></div><div class="row" style="margin:10px 0 2px"><input id="bb_tk" type="number" inputmode="numeric" value="'+b.tk+'"><input id="bb_tp" type="number" inputmode="numeric" value="'+b.tp+'"></div><div class="sub" style="margin:0 0 6px">Upar: kcal target aur protein (g) target, dono badal sakte ho.</div>';
var gp='';b.meals.forEach(function(m,i){if(m.g!==gp){gp=m.g;h+='<h2 style="margin:10px 0 0;color:var(--mut)">'+esc(gp)+'</h2>'}
if(MEDIT)h+='<div class="row" style="margin:6px 0 4px"><input id="bb_mn_'+i+'" value="'+esc(m.n)+'"></div><div class="row" style="margin:0 0 6px"><input id="bb_mk_'+i+'" type="number" value="'+m.k+'"><input id="bb_mp_'+i+'" type="number" value="'+m.p+'"></div>';else h+=bdTick('bb_m_'+i,c['m'+i],esc(m.n)+'<span class="t">~'+m.k+' kcal \u00b7 '+m.p+'g protein</span>')});

function planCard(){var p=S.plan[T]||[];if(!p.length)return '';var h='<div class="card"><h2>Aaj ke Top tasks</h2>';p.forEach(function(x,i){h+='<label class="it'+(x.d?' done':'')+'"><input type="checkbox" data-k="k'+i+'"'+(x.d?' checked':'')+'><span class="x">'+esc(x.t)+'</span></label>'});return h+'<div class="row" style="margin:8px 0 0"><button data-rs="1" style="flex:1;background:var(--card);color:var(--tx);border:1.5px solid var(--bd);box-shadow:none">Baaki tasks kal ke liye bhejo</button></div></div>'}
function renderCy(){

p.forEach(function(x){if(x.d)ok+='<div style="'+st+'">\u2713 '+esc(x.t)+'</div>';else no+='<div style="'+st+'color:var(--bad)">\u2717 '+esc(x.t)+'</div>'});
h+='<h2 style="margin-top:12px">Kya kiya</h2>'+(ok||'<div class="sub">Abhi kuch nahi</div>')+'<h2 style="margin-top:12px">Baaki raha</h2>'+(no||'<div class="sub">Sab ho gaya!</div>')+'</div>';
h+='<div class="card"><h2>Kal ke Top 3 tasks</h2><div class="sub" style="margin:0 0 8px">'+fmt(tm)+'</div><div class="row"><input id="pl1" placeholder="Kal kya karna hai?"><button id="addplan">+</button></div>';
pn.forEach(function(x,i){h+='<div style="display:flex;align-items:center;padding:9px 0;border-top:1px solid var(--bd);font-size:14px"><span style="flex:1">'+esc(x.t)+'</span><button class="del" data-pd="'+i+'">\u2715</button></div>'});
h+='</div><div class="card"><h2>Aaj ki diary</h2><textarea id="note" rows="5" placeholder="Aaj kaisa raha? Kya seekha? Kya mushkil laga?" style="width:100%;padding:12px;border:1.5px solid var(--bd);border-radius:14px;background:var(--card);color:var(--tx);font:500 15px DM Sans,system-ui,sans-serif;resize:vertical">'+esc(S.note[T]||'')+'</textarea><div class="row" style="margin:10px 0 0"><button id="savenote" style="flex:1">Diary save karo</button></div></div>';
h+='</div><div class="card"><h2>Aaj ka check-in</h2>';var dj=S.dj[T]||{};
['mood','en'].forEach(function(f){h+='<div class="sub" style="margin:0 0 4px">'+(f==='mood'?'Mood (1 kharab - 5 badhiya)':'Energy (1 kam - 5 zyada)')+'</div><div class="chips">';[1,2,3,4,5].forEach(function(n){h+='<button class="chip'+(dj[f]===n?' on':'')+'" data-mo="'+f+n+'">'+n+'</button>'})
h+='</div>'});
h+='<div class="row"><input id="djd" placeholder="Aaj ki sabse badi dikkat" value="'+esc(dj.dif||'')+'"></div><div class="row"><input id="djr" placeholder="Phone distraction / taalne ka reason" value="'+esc(dj.dr||'')+'"></div><div class="row" style="margin:0"><input id="dji" placeholder="Kal ke liye ek practical sudhar" value="'+esc(dj.imp||'')+'"></div></div>';
var ks={};Object.keys(S.note).concat(Object.keys(S.plan),Object.keys(S.dj)).forEach(function(k){if(k<T)ks[k]=1});var ds=Object.keys(ks).sort().reverse().filter(function(k){if(!S.sq)return true;var j=S.dj[k]||{};return ((S.note[k]||'')+' '+(S.plan[k]||[]).map(function(x){return x.t}).join(' ')+' '+[j.dif,j.dr,j.imp].join(' ')).toLowerCase().indexOf(S.sq.toLowerCase())>=0}).slice(0,S.sq?60:14);
{h+='<div class="card"><h2>Purani diary</h2><div class="row"><input id="dsrch" placeholder="Diary mein dhundo" value="'+esc(S.sq||'')+'"></div>';ds.forEach(function(k){var pl=S.plan[k]||[];h+='<div style="padding:10px 0;border-top:1px solid var(--bd);font-size:13px"><b>'+fmt(k)+'</b><div class="sub" style="margin:2px 0 4px">Padhai '+fmtH(dayS(k))+' \u00b7 Kaam '+cnt(k)+'/'+ROUTINE.length+'</div>';pl.forEach(function(x){h+='<div style="padding:2px 0;color:'+(x.d?'var(--ok)':'var(--bad)')+'">'+(x.d?'\u2713 ':'\u2717 ')+esc(x.t)+'</div>'});var j=S.dj[k]||{};if(j.mood)h+='<div class="sub" style="margin:2px 0">Mood '+j.mood+'/5 \u00b7 Energy '+(j.en||'-')+'/5</div>';[['Dikkat',j.dif],['Distraction',j.dr],['Sudhar',j.imp]].forEach(function(z){if(z[1])h+='<div style="margin-top:2px">'+z[0]+': '+esc(z[1])+'</div>'});if(S.note[k])h+='<div style="margin-top:4px;white-space:pre-wrap">'+esc(S.note[k])+'</div>';h+='</div>'});h+='</div>'}
h+=bkCard();document.getElementById("cy").innerHTML=h;
}
function dayS(k){return (S.study[k]||0)+(k===T?tmSec():0)}
function progCard(){var d=parse(T),rows=[],tot=0,best=0,k,i,v;for(i=0;i<7;i++){k=key(d);rows.push(k);v=dayS(k);tot+=v;best=Math.max(best,v);d.setDate(d.getDate()-1)}var mx=Math.max(1,best),tod=dayS(T),yes=dayS(rows[1]),df=tod-yes,st=0,dd=parse(T);if(tod===0)dd.setDate(dd.getDate()-1);while(key(dd)>=S.start&&dayS(key(dd))>0&&st<400){st++;dd.setDate(dd.getDate()-1)}
var h='<div class="card"><h2>Padhai progress</h2><div class="sub" style="margin:0 0 4px">Kal: '+fmtH(yes)+' · Aaj: '+fmtH(tod)+'</div><div style="font-size:14px;font-weight:700;margin-bottom:10px;color:'+(df>=0?'var(--ok)':'var(--mut)')+'">'+(df>=0?'Kal se '+fmtH(df)+' zyada':'Kal se '+fmtH(-df)+' kam')+'</div>';
rows.slice().reverse().forEach(function(k){var v=dayS(k),p=Math.round(v*100/mx);h+='<div style="display:flex;align-items:center;gap:8px;font-size:12px;margin:6px 0"><span style="width:58px;color:var(--mut)">'+parse(k).toLocaleDateString('en-IN',{weekday:'short',day:'numeric'})+'</span><div class="bar" style="flex:1;margin:0"><i style="width:'+p+'%"></i></div><span style="width:70px;text-align:right">'+fmtH(v)+'</span></div>'});
h+='<div class="sub" style="margin:10px 0 0">Is hafte: '+fmtH(tot)+' · Average: '+fmtH(Math.round(tot/7))+'/din · Best: '+fmtH(best)+' · Streak: '+st+' din</div>'+subjLine(rows)+'</div><div class="card"><h2>Din ka hisaab</h2>';
rows.forEach(function(k){h+='<div style="padding:9px 0;border-bottom:1px solid var(--bd);font-size:13px"><b>'+fmt(k)+'</b><div class="sub" style="margin:2px 0 0">Padhai '+fmtH(dayS(k))+' · Kaam '+cnt(k)+'/'+ROUTINE.length+' · Questions '+((S.qlog&&S.qlog[k])||0)+' · Chapter '+((S.cl&&S.cl[k])||0)+'</div></div>'});
return h+'</div>'}
function renderCal(){
var y=calM.getFullYear(),mo=calM.getMonth(),first=new Date(y,mo,1).getDay(),dim=new Date(y,mo+1,0).getDate();
var h=progCard()+'<div class="card"><div class="nav"><button data-m="-1">‹</button><b>'+calM.toLocaleDateString("en-IN",{month:"long",year:"numeric"})+'</b><button data-m="1">›</button></div><div class="cal">';
["Su","Mo","Tu","We","Th","Fr","Sa"].forEach(function(x){h+='<div class="h">'+x+'</div>'});
for(var i=0;i<first;i++)h+='<div></div>';
for(var d=1;d<=dim;d++){var k=y+"-"+pad(mo+1)+"-"+pad(d);h+='<button data-day="'+k+'" class="'+cls(k)+(k===T?' tdy':'')+(k===selDay?' sel':'')+'">'+d+'</button>'}
h+='</div><div class="leg"><span class="lg ok"></span>Pura (80%+)<span class="lg part"></span>Adhura<span class="lg miss"></span>Chhut gaya</div></div><div class="card"><h2>'+fmt(selDay)+'</h2>';
if(selDay<S.start)h+='<div class="sub">App shuru hone se pehle ka din.</div>';
else if(selDay>T)h+='<div class="sub">Aane wala din.</div>';
else{var dn=S.hist[selDay]||[],n=dn.length;
h+='<div class="sub">'+(n===0&&selDay<T?'Is din kuch record nahi hua.':n+'/'+ROUTINE.length+' kaam hue')+'</div>';

ROUTINE.forEach(function(r,i){if(dn.indexOf(i)<0)h+='<div style="font-size:13px;padding:3px 0">'+(selDay<T?'✗ ':'○ ')+esc(r[0])+' <span class="sub">'+esc(r[1])+'</span></div>'})}
document.getElementById("cal").innerHTML=h+'</div>';
}
function all(){renderAaj();renderSyl();renderCy();renderCal();renderBd()}
function tab(id){["aaj","syl","cy","cal","bd"].forEach(function(x){document.getElementById(x).hidden=x!==id});document.querySelectorAll(".tabs button").forEach(function(b){b.classList.toggle("on",b.getAttribute("data-t")===id)})}
document.addEventListener("change",function(e){
var id0=e.target.id||"";
if(id0.indexOf("bb_")===0){bdChange(e.target);return}
if(id0==="fsub"){S.tm.sub=e.target.value;S.tm.c="";save();all();return}
if(id0==="fch"){S.tm.c=e.target.value;save();return}

if(/^dj[dri]$/.test(id0)){(S.dj[T]=S.dj[T]||{})[{djd:"dif",djr:"dr",dji:"imp"}[id0]]=e.target.value;save();return}
if(/^r[nt]\d+$/.test(id0)){var ri=+id0.slice(2);ROUTINE[ri][id0[1]==="n"?0:1]=e.target.value;S.rt=ROUTINE.map(function(r){return [r[0],r[1]]});save();return}

if(k[0]==="z"){var pz=k.slice(1).split("_"),cx=S.syl[+pz[0]],jj=+pz[1];S.qd=S.qd||{};var arr=S.qd[cx.c]=S.qd[cx.c]||[],ix=arr.indexOf(jj);if(e.target.checked){if(ix<0){arr.push(jj);cx.q=(cx.q||0)+1;S.qlog[T]=(S.qlog[T]||0)+1}}else if(ix>=0){arr.splice(ix,1);cx.q=Math.max(0,(cx.q||0)-1);S.qlog[T]=Math.max(0,(S.qlog[T]||0)-1)}save();all();return}
var i=+k.slice(1),v=e.target.checked;
if(k[0]==="r"){S.routine[i]=v;S.hist[T]=doneList()}else if(k[0]==="k")S.plan[T][i].d=v;else if(k[0]==="b")S.dbt[i].done=v;else if(k[0]==="p")S.syl[i].p=v;else{S.syl[i].d=v;S.cl[T]=Math.max(0,(S.cl[T]||0)+(v?1:-1))}
save();all();
});
document.addEventListener("click",function(e){

else if(g("data-mo")){var mo=g("data-mo"),f0=mo.slice(0,-1);(S.dj[T]=S.dj[T]||{})[f0]=+mo.slice(-1);save();all()}
else if(t.id==="bk"){BK=JSON.stringify(S);BM="Backup ban gaya. Copy dabao aur kahin save kar lo.";CONF="";all()}
else if(t.id==="cp"){var ta=document.getElementById("bkt");ta.select();try{navigator.clipboard.writeText(ta.value);BM="Copy ho gaya."}catch(x){BM="Text select hai, khud copy kar lo."}BK=ta.value;all()}
else if(t.id==="rs"){var txt=document.getElementById("bkt").value.trim();BK=txt;var o;try{o=JSON.parse(txt)}catch(x){o=null}if(!o||typeof o!=="object"||!o.syl||!o.hist){BM="Ye sahi backup nahi hai. Poora backup text paste karo.";CONF=""}else if(CONF!=="rs"){CONF="rs";BM="Pakka? Abhi ka sab data is backup se badal jayega. Dobara Restore dabao."}else{try{localStorage.setItem("focus_v1",txt);BM="Restore ho gaya. App dobara khol lo.";CONF="";location.reload()}catch(x){BM="Restore nahi hua."}}all()}
else if(t.id==="clr"){if(CONF!=="clr"){CONF="clr";BM="Pakka? Sab data hamesha ke liye mit jayega. Dobara dabao."}else{try{localStorage.removeItem("focus_v1");location.reload()}catch(x){BM="Nahi hua."}CONF=""}all()}
else if(g("data-q")){var a=g("data-q").split(","),c2=S.syl[+a[0]];c2.q=Math.max(0,(c2.q||0)+(+a[1]));S.qlog[T]=Math.max(0,(S.qlog[T]||0)+(+a[1]));save();all()}
else if(g("data-day")){selDay=g("data-day");renderCal()}

});
